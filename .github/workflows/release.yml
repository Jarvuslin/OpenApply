# One release for the OpenApply host and bundled plugin.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: windows-latest
            rid: win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish AOT
        run: dotnet publish -c Release -r ${{ matrix.rid }} -o publish/
        working-directory: apps/terminal

      # The publish dir contains the native binary AND the bundled plugin/ tree,
      # so archive the whole directory, not just the binary.
      - name: Archive (Unix)
        if: runner.os != 'Windows'
        run: tar -czf openapply-terminal-${{ matrix.rid }}.tar.gz -C apps/terminal/publish .

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path apps/terminal/publish/* -DestinationPath openapply-terminal-${{ matrix.rid }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: openapply-terminal-${{ matrix.rid }}
          path: openapply-terminal-${{ matrix.rid }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download terminal artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*/openapply-terminal-*
          generate_release_notes: true
